<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <div class="popup-header">
      <div class="brand">
        <span class="logo">🧠</span>
        <div>
          <h2>PromptCraft <span>AI</span></h2>
          <p>مهندس الأوامر الذكي</p>
        </div>
      </div>
      <span class="status-dot" id="server-dot" title="حالة الاتصال بالخادم"></span>
    </div>

    <div class="popup-body">
      <div class="form-group">
        <label for="popup-domain">المجال الافتراضي:</label>
        <select id="popup-domain">
          <option value="auto">🎯 اكتشاف تلقائي (Auto)</option>
          <option value="software_engineering">💻 هندسة وبرمجة</option>
          <option value="data_science_ai">📊 ذكاء اصطناعي وبيانات</option>
          <option value="cybersecurity">🛡️ أمن سيبراني</option>
          <option value="academic_research">🎓 بحث علمي</option>
        </select>
      </div>

      <div class="form-group">
        <label for="popup-framework">إطار الهندسة:</label>
        <select id="popup-framework">
          <option value="CO-STAR">CO-STAR</option>
          <option value="CRISPE">CRISPE</option>
        </select>
      </div>

      <div class="form-group toggle-group">
        <label for="auto-replace-toggle">استبدال تلقائي فوري:</label>
        <input type="checkbox" id="auto-replace-toggle" checked>
      </div>

      <div class="tip-card">
        💡 <strong>طريقة الاستخدام:</strong> عند فتح (ChatGPT / Claude / Gemini)، ستجد زراً عائماً بجانب مربع النص. اضغط عليه لتحويل أمرك العربي فورياً!
      </div>
    </div>

    <div class="popup-footer">
      <button id="btn-open-dashboard" class="btn-dashboard">🚀 فتح لوحة التحكم الكاملة</button>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
